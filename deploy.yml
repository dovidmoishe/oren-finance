# Production release stack. Run through the GitHub workflow or the documented
# VPS commands so every service receives the same immutable IMAGE_TAG.
name: oren

services:
  db:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [oren, signer-db]

  api-migrate:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .release.env}/oren-api:${IMAGE_TAG:?set IMAGE_TAG in .release.env}
    env_file: .env
    command: ["node", "lib/db/migrate.mjs"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [oren]

  api:
    environment:
      DEPLOYMENT_ENV: production
      COMMIT_SHA: ${IMAGE_TAG}
      # Never pass standalone migration credentials or the gate key to API.
      POSTGRES_USER: ""
      POSTGRES_PASSWORD: ""
      SIGNER_GATE_PRIVATE_KEY: ""
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .release.env}/oren-api:${IMAGE_TAG:?set IMAGE_TAG in .release.env}
    restart: unless-stopped
    # The later runtime file overrides the admin URL after staged provisioning.
    # It is optional while delegated execution is compiled off.
    env_file:
      - .env
      - path: .env.api
        required: false
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks: [oren, signer-api, signer-db]

  signer-gate:
    profiles: [delegated-trades]
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .release.env}/oren-api:${IMAGE_TAG:?set IMAGE_TAG in .release.env}
    command: ["node", "dist/src/signer-gate/main"]
    restart: unless-stopped
    env_file:
      - path: .env.signer-gate
        required: false
    environment:
      DEPLOYMENT_ENV: production
      SIGNER_GATE_ENABLED: ${SIGNER_GATE_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks: [signer-db, signer-api, signer-egress]

  app:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .release.env}/oren-app:${IMAGE_TAG:?set IMAGE_TAG in .release.env}
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./media/videos
        target: /app/public/videos
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks: [oren]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/oren/preview/sites:/etc/caddy/previews:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [oren, preview-edge]

  # Intentional, manual first-run/catalog refresh task; never on user requests.
  catalog-sync:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in .release.env}/oren-api:${IMAGE_TAG:?set IMAGE_TAG in .release.env}
    profiles: [bootstrap]
    env_file: .env
    command: ["node", "lib/db/sync-stocks.mjs"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [oren]

networks:
  preview-edge:
    external: true
  oren:
    driver: bridge
  signer-db:
    internal: true
  signer-api:
    internal: true
  signer-egress:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
