<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Oren post template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..600&display=swap">
<style>
  /*
    Oren social post, 1600x900. See ../SKILL.md for how to fill and render it.
    1. Set data-template on .frame: "scene" (painting behind, for launches and big news)
       or "plain" (warm mist, for everyday updates).
    2. Replace the badge, headline, second line and body text. Nothing else.
    3. For a scene, point --scene at a painting from app/public or a new scene made with the recipe in ../brand.md.
    4. Open this file in a browser at 1600x900 and screenshot the .frame element.
  */
  :root {
    --mist: #fefbf5;
    --ink: #120f0b;
    --muted: #6f685e;
    --text-2: #474139;
    --brand-text: #5d4b89;
    --brand-soft: #f4f1fd;
    --brand-tint: #e9e4fb;
    --brand-line: #d3cbef;
    --scene: url("../../../../app/public/oren-editorial-landscape-hero.webp");
    --scene-position: 62% 30%;
  }
  html, body { margin: 0; background: #ffffff; }
  .frame { container-type: inline-size; position: relative; overflow: hidden; isolation: isolate; width: 1600px; height: 900px; color: var(--ink); background: var(--mist); font-family: "Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  .frame[data-template="scene"] { background: var(--mist) var(--scene) var(--scene-position) / cover no-repeat; }
  .frame[data-template="scene"]::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgb(254 251 245 / .94) 0%, rgb(254 251 245 / .82) 34%, rgb(254 251 245 / .2) 58%, rgb(254 251 245 / 0) 70%), linear-gradient(0deg, rgb(254 251 245 / .7), rgb(254 251 245 / 0) 30%); }
  .glow { display: none; position: absolute; right: -14cqw; bottom: -24cqw; width: 62cqw; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(closest-side, var(--brand-tint), rgb(255 255 255 / 0)); z-index: -1; }
  .frame[data-template="plain"] .glow { display: block; }
  .lockup { position: absolute; left: 6.5cqw; top: 5.4cqw; display: flex; align-items: center; gap: .9cqw; font-size: 1.55cqw; font-weight: 600; letter-spacing: .18em; }
  .lockup svg { width: 2.8cqw; height: 2.8cqw; overflow: visible; }
  .badge { position: absolute; left: 6.5cqw; top: 13cqw; display: inline-flex; align-items: center; gap: .8cqw; font-size: 1.7cqw; font-weight: 500; color: var(--brand-text); background: var(--brand-soft); border: 1px solid var(--brand-line); border-radius: 999px; padding: .8cqw 1.6cqw .8cqw 1.2cqw; }
  .badge svg { width: 1.9cqw; height: 1.9cqw; }
  .copy { position: absolute; left: 6.5cqw; top: 20.5cqw; width: 50cqw; }
  .headline { margin: 0; font-size: 5.6cqw; line-height: 1.03; letter-spacing: -.05em; font-weight: 500; }
  .headline span { display: block; color: var(--muted); }
  .body { margin: 2.2cqw 0 0; font-size: 1.75cqw; line-height: 1.45; color: var(--text-2); max-width: 36cqw; }
  .mascot { position: absolute; }
  .mascot svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .frame[data-template="scene"] .mascot { right: 9cqw; bottom: 6cqw; width: 19cqw; height: 19cqw; }
  .frame[data-template="scene"] .mascot::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: 4%; height: 7%; border-radius: 50%; background: rgb(60 45 30 / .22); filter: blur(.8cqw); z-index: -1; }
  .frame[data-template="plain"] .mascot { right: -6cqw; bottom: -8cqw; width: 44cqw; height: 44cqw; }
</style>
</head>
