name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # Replace stale PR checks while each master push retains its own CI run.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preview-infra:
    name: Preview infrastructure tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, oren-build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Configure disposable preview fixture paths
        run: |
          echo "PREVIEW_PROVIDER_ENV=$RUNNER_TEMP/ci-preview-provider.env" >> "$GITHUB_ENV"
          echo "PREVIEW_OAUTH_ENV=$RUNNER_TEMP/ci-preview-oauth.env" >> "$GITHUB_ENV"
          echo "PREVIEW_ACCESS_ENV=$RUNNER_TEMP/ci-preview-access.env" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test infra/ci/*.test.mjs infra/preview/*.test.mjs infra/docs/*.test.mjs
      - run: for script in infra/ci/*.sh; do bash -n "$script"; done
      - run: node --test infra/signer-gate/trading-policy.test.mjs infra/signer-gate/build-launch-policy.test.mjs
      - run: node --check infra/signer-gate/prepare-trading-policy.mjs && node --check infra/signer-gate/policy-owner.mjs
      - run: for script in infra/preview/*.sh; do bash -n "$script"; done
      - run: bash -n infra/mcp/enable-oauth.sh
      - run: bash -n infra/signer-gate/provision-roles.sh
      - run: bash -n infra/signer-gate/bootstrap-disabled-gate.sh && node --check infra/signer-gate/bootstrap-keys.mjs
      - run: bash -n infra/signer-gate/enable-owner-buy.sh && bash -n infra/signer-gate/kill-owner-buy.sh && node --check infra/signer-gate/verify-owner-buy.mjs
      - run: bash -n infra/signer-gate/diagnose-grant.sh
      - name: Validate preview Compose configuration
        env:
          PR_NUMBER: '42'
          COMMIT_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GHCR_OWNER: example
          IMAGE_TAG: pr-42-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PREVIEW_HOST: pr-42.preview.example.com
          DB_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          touch "$PREVIEW_PROVIDER_ENV" "$PREVIEW_ACCESS_ENV" "$PREVIEW_OAUTH_ENV"
          docker compose -f infra/preview/compose.yml config --quiet
          docker compose -f infra/preview/access.compose.yml config --quiet
      - name: Validate production signer-gate Compose profile
        env:
          GHCR_OWNER: example
          IMAGE_TAG: test-image
          POSTGRES_USER: oren_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: oren_mcp_test
          DOMAIN: production.example.com
          API_DOMAIN: api.production.example.com
        run: |
          printf 'POSTGRES_URL=postgres://oren_test:test-password@db:5432/oren_mcp_test\n' > .env
          docker compose -f deploy.yml config --quiet
          printf 'POSTGRES_URL=postgres://oren_test:test-password@db:5432/oren_mcp_test\n' > .env.api
          docker compose --profile delegated-trades -f deploy.yml config --quiet
      - name: Verify production image pins override tags
        env:
          GHCR_OWNER: example
          IMAGE_TAG: test-image
          POSTGRES_USER: oren_test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: oren_mcp_test
          DOMAIN: production.example.com
          API_DOMAIN: api.production.example.com
          OREN_API_IMAGE: ghcr.io/example/oren-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          OREN_APP_IMAGE: ghcr.io/example/oren-app@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: |
          docker compose --profile delegated-trades -f deploy.yml config --format json > "$RUNNER_TEMP/pinned-compose.json"
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const c=JSON.parse(fs.readFileSync(process.argv[1])); for (const s of ['api','api-migrate','signer-gate']) assert.equal(c.services[s].image,process.env.OREN_API_IMAGE); assert.equal(c.services.app.image,process.env.OREN_APP_IMAGE);" "$RUNNER_TEMP/pinned-compose.json"
      - name: Verify two disposable preview databases are isolated
        run: bash infra/preview/isolation.sh
      - name: Validate Caddy with a generated preview route
        run: |
          mkdir -p "$RUNNER_TEMP/caddy-previews"
          awk '/^cat >.*route.candidate.*<<EOF/ {capture=1;next} capture && /^EOF$/ {exit} capture' infra/preview/manage.sh | sed 's/\$HOST/pr-42.preview.example.com/g;s/\$PR/42/g' > "$RUNNER_TEMP/caddy-previews/pr-42.caddy"
          test -s "$RUNNER_TEMP/caddy-previews/pr-42.caddy"
          docker run --rm -e DOMAIN=production.example.com -e API_DOMAIN=api.production.example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$RUNNER_TEMP/caddy-previews:/etc/caddy/previews:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
  api:
    name: API test and build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, oren-build]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oren_test
          POSTGRES_PASSWORD: oren_test
          POSTGRES_DB: oren_mcp_test
        ports:
          - '127.0.0.1::5432'
        options: >-
          --health-cmd "pg_isready -U oren_test -d oren_mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Configure disposable Postgres connection
        env:
          TEST_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          [[ "$TEST_DB_PORT" =~ ^[0-9]+$ ]]
          echo "MCP_TEST_POSTGRES_URL=postgres://oren_test:oren_test@127.0.0.1:$TEST_DB_PORT/oren_mcp_test" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      # setup-node caches the package store only. This directory holds the
      # full-metadata mirror and lockfile-verified.jsonl, which skips the
      # registry when the lockfile is unchanged.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pnpm
          key: pnpm-metadata-api-${{ runner.os }}-11.22-${{ hashFiles('api/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-metadata-api-${{ runner.os }}-11.22-
      - name: Install dependencies
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test --runInBand
      - run: pnpm run test:mcp:guard
      - run: pnpm run test:withdrawals
      - run: pnpm run test:approval:crypto
      - run: pnpm build
      - run: pnpm run test:mcp:gate
      - run: pnpm run test:mcp:registration
      - name: Apply restricted signer-gate roles to disposable Postgres
        env:
          TEST_DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec -i -e PGPASSWORD=oren_test "$TEST_DB_CONTAINER" \
            psql -U oren_test -d oren_mcp_test \
            -v api_password=api_test_password \
            -v gate_password=gate_test_password < ../infra/signer-gate/roles.sql
          node scripts/test-signer-gate-roles.mjs
      - name: Verify migration readability from a restrictive checkout
        run: |
          chmod -R go-rwx lib/db
          chmod go-rwx package.json
          docker build -t "oren-api-ci:$GITHUB_SHA" .
          docker run --rm -i --read-only --network none --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --entrypoint node "oren-api-ci:$GITHUB_SHA" \
            --input-type=module - < ../infra/ci/runtime-readable.mjs

  app-check:
    name: App ${{ matrix.check }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, ${{ matrix.runner }}]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: test
            runner: oren-build
          - check: lint
            runner: oren-light
          - check: build
            runner: oren-build
    defaults:
      run:
        working-directory: app
    env:
      # Match the same-origin path used by PR preview images; this catches
      # prerender failures that an absolute CI URL would miss.
      NEXT_PUBLIC_OREN_API_URL: /api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      # setup-node caches the package store only. This directory holds the
      # full-metadata mirror and lockfile-verified.jsonl, which skips the
      # registry when the lockfile is unchanged.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pnpm
          key: pnpm-metadata-app-${{ runner.os }}-11.22-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-metadata-app-${{ runner.os }}-11.22-
      - name: Install dependencies
        timeout-minutes: 8
        run: pnpm install --frozen-lockfile
      - name: Run check
        env:
          CHECK: ${{ matrix.check }}
        run: |
          if [ "$CHECK" = lint ]; then
            node scripts/lint-bounded.mjs
          else
            pnpm run "$CHECK"
          fi

  # Preserve the required-check name used by preview setup and branch protection.
  # The body is one shell comparison. It uses the bounded light runner so it
  # does not take the single heavy worker. Do not merge until oren-vps-light
  # is online; a missing label queues this required check.
  app:
    name: App test, lint, and build
    needs: app-check
    if: always()
    runs-on: [self-hosted, linux, x64, oren-light]
    steps:
      - name: Require all web checks
        env:
          RESULT: ${{ needs.app-check.result }}
        run: test "$RESULT" = success
