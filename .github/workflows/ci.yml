name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  preview-infra:
    name: Preview infrastructure tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test infra/preview/*.test.mjs
      - run: for script in infra/preview/*.sh; do bash -n "$script"; done
      - run: bash -n infra/mcp/enable-oauth.sh
      - name: Validate preview Compose configuration
        env:
          PR_NUMBER: '42'
          COMMIT_SHA: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          GHCR_OWNER: example
          IMAGE_TAG: pr-42-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PREVIEW_HOST: pr-42.preview.example.com
          DB_PASSWORD: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          sudo install -d /opt/oren/preview/stacks/pr-42
          sudo touch /opt/oren/preview/provider.env /opt/oren/preview/access.env /opt/oren/preview/stacks/pr-42/oauth.env
          docker compose -f infra/preview/compose.yml config --quiet
          docker compose -f infra/preview/access.compose.yml config --quiet
      - name: Verify two disposable preview databases are isolated
        run: bash infra/preview/isolation.sh
      - name: Validate Caddy with a generated preview route
        run: |
          mkdir -p "$RUNNER_TEMP/caddy-previews"
          awk '/^cat >.*route.candidate.*<<EOF/ {capture=1;next} capture && /^EOF$/ {exit} capture' infra/preview/manage.sh | sed 's/\$HOST/pr-42.preview.example.com/g;s/\$PR/42/g' > "$RUNNER_TEMP/caddy-previews/pr-42.caddy"
          test -s "$RUNNER_TEMP/caddy-previews/pr-42.caddy"
          docker run --rm -e DOMAIN=production.example.com -e API_DOMAIN=api.production.example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$RUNNER_TEMP/caddy-previews:/etc/caddy/previews:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
  api:
    name: API test and build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oren_test
          POSTGRES_PASSWORD: oren_test
          POSTGRES_DB: oren_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oren_test -d oren_mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MCP_TEST_POSTGRES_URL: postgres://oren_test:oren_test@127.0.0.1:5432/oren_mcp_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --runInBand
      - run: pnpm run test:mcp:guard
      - run: pnpm run test:approval:crypto
      - run: pnpm build
      - run: pnpm run test:mcp:registration

  app:
    name: App test, lint, and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      # Match the same-origin path used by PR preview images; this catches
      # prerender failures that an absolute CI URL would miss.
      NEXT_PUBLIC_OREN_API_URL: /api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
