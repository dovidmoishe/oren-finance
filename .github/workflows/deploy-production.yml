name: Deploy production release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs-site/**'
      - 'infra/docs/**'
      - '.github/workflows/docs-site.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable Git SHA to deploy or roll back to
        required: true
        type: string

concurrency:
  group: production-deploy
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci-gate:
    name: Require successful master CI for release SHA
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, oren-control]
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      # Always execute trusted gating code, including during manual rollback.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}
        with:
          script: |
            const {requireProductionCi} = await import(process.env.GITHUB_WORKSPACE + '/infra/preview/production-ci.mjs');
            const id = await requireProductionCi({github, repo: context.repo, sha: process.env.RELEASE_SHA});
            core.notice(`Production CI verified: ${id} for ${process.env.RELEASE_SHA}`);
  build-api:
    needs: ci-gate
    name: Build and publish API image
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, oren-release]
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-buildx-action@v3
      - name: Locate private API build cache
        id: cache
        run: |
          mkdir -p /home/oren-ci-release/cache
          if [[ -f /home/oren-ci-release/cache/api/index.json ]]; then
            echo 'from=type=local,src=/home/oren-ci-release/cache/api' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/oren-api:${{ github.sha }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: type=local,dest=/home/oren-ci-release/cache/api-next,mode=max
      - name: Verify runtime migration files as the image default user
        env:
          API_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          [[ "$API_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker run --rm -i --read-only --network none --cap-drop ALL --security-opt no-new-privileges \
            --memory 512m --entrypoint node "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oren-api@$API_DIGEST" \
            --input-type=module - < infra/ci/runtime-readable.mjs
      - name: Retain private API build cache
        run: |
          test "$(id -un)" = oren-ci-release
          rm -rf --one-file-system /home/oren-ci-release/cache/api
          mv /home/oren-ci-release/cache/api-next /home/oren-ci-release/cache/api
  build-app:
    needs: ci-gate
    name: Build and publish web image
    if: github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, oren-release]
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate public application origin
        env:
          PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN || 'https://oren.finance' }}
          PUBLIC_API_ORIGIN: ${{ vars.PUBLIC_API_ORIGIN || 'https://api.oren.finance' }}
        run: |
          test -n "$PUBLIC_APP_ORIGIN"
          test -n "$PUBLIC_API_ORIGIN"
      - uses: docker/setup-buildx-action@v3
      - name: Locate private web build cache
        id: cache
        run: |
          mkdir -p /home/oren-ci-release/cache
          if [[ -f /home/oren-ci-release/cache/app/index.json ]]; then
            echo 'from=type=local,src=/home/oren-ci-release/cache/app' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: publish
        with:
          context: ./app
          file: ./app/Dockerfile
          build-args: |
            NEXT_PUBLIC_OREN_API_URL=${{ vars.PUBLIC_API_ORIGIN || 'https://api.oren.finance' }}/api
            NEXT_PUBLIC_PRIVY_APP_ID=${{ vars.PRIVY_APP_ID }}
            NEXT_PUBLIC_MCP_SIGNER_QUORUM_ID=${{ vars.MCP_SIGNER_QUORUM_ID }}
            NEXT_PUBLIC_MCP_SIGNER_POLICY_ID=${{ vars.MCP_SIGNER_POLICY_ID }}
            NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/oren-app:${{ github.sha }}
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: type=local,dest=/home/oren-ci-release/cache/app-next,mode=max
      - name: Retain private web build cache
        run: |
          test "$(id -un)" = oren-ci-release
          rm -rf --one-file-system /home/oren-ci-release/cache/app
          mv /home/oren-ci-release/cache/app-next /home/oren-ci-release/cache/app

  deploy:
    name: Deploy release to VPS
    needs: [ci-gate, build-api, build-app]
    if: >-
      always() && needs['ci-gate'].result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs['build-api'].result == 'success' && needs['build-app'].result == 'success'))
    runs-on: [self-hosted, linux, x64, oren-control]
    environment: production
    outputs:
      api_digest: ${{ steps.manifest.outputs.api_digest }}
      app_digest: ${{ steps.manifest.outputs.app_digest }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}
      GHCR_OWNER: ${{ github.repository_owner }}
      API_BUILD_DIGEST: ${{ needs.build-api.outputs.digest }}
      APP_BUILD_DIGEST: ${{ needs.build-app.outputs.digest }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate release SHA
        run: '[[ "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate production configuration
        env:
          PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN || 'https://oren.finance' }}
          PUBLIC_API_ORIGIN: ${{ vars.PUBLIC_API_ORIGIN || 'https://api.oren.finance' }}
        run: |
          [[ "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GHCR_OWNER" =~ ^[a-z0-9-]+$ ]]
          test -n "$PUBLIC_APP_ORIGIN"
          test -n "$PUBLIC_API_ORIGIN"
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KNOWN_HOSTS"
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      - name: Configure verified VPS host key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Select immutable production images
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
              "cat /opt/oren/releases/$IMAGE_TAG.env" | node infra/ci/images.mjs "$GHCR_OWNER" --record >> "$GITHUB_ENV"
          else
            node infra/ci/images.mjs "$GHCR_OWNER" "$API_BUILD_DIGEST" "$APP_BUILD_DIGEST" >> "$GITHUB_ENV"
          fi
      - name: Prepare preview routing prerequisites
        run: |
          ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "install -d -m 750 /opt/oren/preview/sites && (docker network inspect preview-edge >/dev/null 2>&1 || docker network create preview-edge)"
      - name: Copy release configuration
        run: |
          scp -P "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes \
            deploy.yml Caddyfile "$VPS_USER@$VPS_HOST:/opt/oren/"
          scp -r -P "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes \
            infra "$VPS_USER@$VPS_HOST:/opt/oren/"
      - name: Verify separately uploaded public videos
        run: |
          ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "cd /opt/oren/media/videos && sha256sum -c /opt/oren/infra/videos.sha256"
      - name: Authenticate VPS to GHCR for this release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
      - name: Activate immutable release
        run: |
          ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "cd /opt/oren && if [ -f .env.signer-gate ]; then export COMPOSE_PROFILES=delegated-trades; fi && printf 'GHCR_OWNER=%s\\nIMAGE_TAG=%s\\nOREN_API_IMAGE=%s\\nOREN_APP_IMAGE=%s\\n' '$GHCR_OWNER' '$IMAGE_TAG' '$OREN_API_IMAGE' '$OREN_APP_IMAGE' > .release.env && docker compose --env-file .env --env-file .release.env -f deploy.yml pull && docker logout ghcr.io && docker compose --env-file .env --env-file .release.env -f deploy.yml up -d --wait --wait-timeout 180 --remove-orphans && if [ -f infra/preview/connect-caddy.sh ]; then bash infra/preview/connect-caddy.sh; fi && docker compose --env-file .env --env-file .release.env -f deploy.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile"

      - name: Verify public production endpoints
        env:
          PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN || 'https://oren.finance' }}
          PUBLIC_API_ORIGIN: ${{ vars.PUBLIC_API_ORIGIN || 'https://api.oren.finance' }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          page=$(curl --fail --silent --show-error --retry 5 --retry-delay 5 "$PUBLIC_APP_ORIGIN/")
          if grep -q 'Preview PR #' <<< "$page"; then
            echo 'Production site is serving a preview image' >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$PUBLIC_API_ORIGIN/api/health/ready" | jq -e '.status == "ok"' > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$PUBLIC_API_ORIGIN/api/environment" |
            jq -e --arg sha "$IMAGE_TAG" '.environment == "production" and .commitSha == $sha and .financialExecution == true' > /dev/null

      - name: Record running production image digests
        id: manifest
        run: |
          ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash -s -- '$GHCR_OWNER' '$IMAGE_TAG' '$OREN_API_IMAGE' '$OREN_APP_IMAGE'" <<'REMOTE' >> "$GITHUB_OUTPUT"
          set -euo pipefail
          owner="$1"
          sha="$2"; api_expected="$3"; app_expected="$4"
          for service in api app; do
            image=$(docker inspect --format '{{.Config.Image}}' "oren-$service-1")
            if [[ "$service" == api ]]; then expected="$api_expected"; else expected="$app_expected"; fi
            [[ "$image" == "$expected" ]]
            digest=${image##*@}
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "${service}_digest=$digest"
          done
          install -d -m 750 /opt/oren/releases
          record=$(mktemp "/opt/oren/releases/.$sha.XXXXXX")
          printf 'OREN_API_IMAGE=%s\nOREN_APP_IMAGE=%s\n' "$api_expected" "$app_expected" > "$record"
          chmod 640 "$record"
          mv "$record" "/opt/oren/releases/$sha.env"
          REMOTE

  release:
    name: Record verified production deployment
    needs: [build-api, build-app, deploy]
    if: always() && needs.deploy.result == 'success'
    runs-on: [self-hosted, linux, x64, oren-control]
    permissions:
      contents: write
      packages: read
      actions: read
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}
      API_DIGEST: ${{ needs.deploy.outputs.api_digest }}
      APP_DIGEST: ${{ needs.deploy.outputs.app_digest }}
    steps:
      # The release publisher is trusted default-branch tooling, not selected release code.
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {publishRelease} = await import(process.env.GITHUB_WORKSPACE + '/infra/preview/publish-release.mjs');
            await publishRelease({github, context, core});
