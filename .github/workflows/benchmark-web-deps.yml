name: Benchmark web dependency cache

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/benchmark-web-deps.yml
  workflow_dispatch:

permissions:
  contents: read

# Isolated dependency-only experiment: never publishes or deploys an image.
concurrency:
  group: web-deps-benchmark-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sample-1:
    name: Dependency sample 1 (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [uncached, gha]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build dependency layer
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./app
          target: dependencies
          push: false
          cache-from: ${{ matrix.profile == 'gha' && format('type=gha,scope=web-deps-bench-{0}-{1}', github.run_id, hashFiles('app/Dockerfile', 'app/package.json', 'app/pnpm-lock.yaml', 'app/pnpm-workspace.yaml')) || '' }}
          cache-to: ${{ matrix.profile == 'gha' && format('type=gha,mode=max,scope=web-deps-bench-{0}-{1}', github.run_id, hashFiles('app/Dockerfile', 'app/package.json', 'app/pnpm-lock.yaml', 'app/pnpm-workspace.yaml')) || '' }}
      - name: Record experiment context
        env:
          PROFILE: ${{ matrix.profile }}
          SAMPLE: '1'
          SHA: ${{ github.sha }}
        run: |
          printf '## Dependency cache benchmark\nProfile: %s; sample: %s; SHA: %s\n' "$PROFILE" "$SAMPLE" "$SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Compare full job durations including cache import/export and builder cleanup. Sample 1 is cold; samples 2-6 are warm candidates. This does not measure a full web image.' >> "$GITHUB_STEP_SUMMARY"

