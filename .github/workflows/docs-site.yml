name: Documentation
on:
  pull_request:
    branches: [master]
    paths: ['docs-site/**', 'infra/docs/**', 'Caddyfile', 'api/src/mcp-auth/mcp-resource.ts', '.github/workflows/docs-site.yml', '.github/workflows/deploy-docs.yml']
  push:
    branches: [master]
    paths: ['docs-site/**', 'infra/docs/**', 'Caddyfile', 'api/src/mcp-auth/mcp-resource.ts', '.github/workflows/docs-site.yml', '.github/workflows/deploy-docs.yml']
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docs:
    name: Documentation build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
          package_json_file: docs-site/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: bash -n ../infra/docs/deploy.sh && node --test ../infra/docs/*.test.mjs
      - run: node scripts/validate-content.mjs
      - run: pnpm build
      - run: pnpm types:check
      - name: Verify container packaging
        run: docker build -t oren-docs:ci .
