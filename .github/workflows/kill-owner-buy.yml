name: Kill delegated buy trial

on:
  push:
    tags:
      - signer-gate-kill-*
  workflow_dispatch:
    inputs:
      confirm:
        description: Type kill-owner-buy to disable delegated signing in production
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  kill:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'kill-owner-buy') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/signer-gate-kill-'))
    runs-on: ubuntu-24.04
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Verify VPS configuration and kill script
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          bash -n infra/signer-gate/kill-owner-buy.sh
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      - name: Pin the verified VPS host key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stop signing and restore disabled services
        run: |
          scp -P "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes \
            infra/signer-gate/kill-owner-buy.sh \
            "$VPS_USER@$VPS_HOST:/opt/oren/infra/signer-gate/"
          ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'bash /opt/oren/infra/signer-gate/kill-owner-buy.sh'
