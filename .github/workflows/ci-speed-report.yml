name: CI speed evidence

on:
  workflow_run:
    workflows: [PR preview, Deploy production release, Benchmark web dependency cache]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: read
  pull-requests: read

concurrency:
  group: ci-speed-evidence
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Ignore preview no-op runs
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {core.setOutput('collect', 'true'); return;}
            const {data} = await github.rest.actions.listJobsForWorkflowRun({...context.repo, run_id: context.payload.workflow_run.id, per_page: 100});
            core.setOutput('collect', String(data.jobs.some(j => j.name === 'deploy' || j.name === 'Deploy release to VPS' || j.name.startsWith('Dependency sample'))));
      # Never run a PR checkout in this workflow_run context.
      - uses: actions/checkout@v4
        if: steps.source.outputs.collect == 'true'
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.source.outputs.collect == 'true'
        with:
          node-version: 22
      - name: Collect paired timing evidence
        if: steps.source.outputs.collect == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node infra/preview/ci-speed.mjs --label=rolling --limit=30 --output=ci-speed-latest.json
      - name: Summarize acceptance
        if: steps.source.outputs.collect == 'true'
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import {readFileSync} from 'node:fs';
          const data = JSON.parse(readFileSync('ci-speed-latest.json', 'utf8'));
          console.log('## CI speed acceptance');
          console.log('Seconds; median and nearest-rank p90. Five distinct successes required per cohort.');
          for (const [cohort, stats] of Object.entries(data.summary.cohorts)) {
            console.log(`- ${cohort}: n=${stats.n}; median=${stats.medianSeconds}; p90=${stats.p90Seconds}; ${stats.accepted ? 'sample minimum reached' : 'pending future samples'}`);
          }
          console.log(`Observed failure records: ${data.failures.length}; exclusions: ${data.excluded.length}. See JSON for run links and definitions.`);
          console.log('Preview starts at CI creation, a push-time proxy. Production starts at actual PR merge. No speedup is established by mixed cohorts.');
          NODE
      - uses: actions/upload-artifact@v4
        if: steps.source.outputs.collect == 'true'
        with:
          name: ci-speed-${{ github.run_id }}
          path: ci-speed-latest.json
          retention-days: 90
