name: Diagnose signer gate grant

on:
  push:
    tags:
      - signer-gate-diagnose-*

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check diagnostic script and VPS configuration
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          bash -n infra/signer-gate/diagnose-grant.sh
      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      - name: Pin the verified VPS host key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Read bounded grant diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha=$(git rev-parse HEAD)
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)" = "$release_sha"
          scp -P "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes \
            infra/signer-gate/diagnose-grant.sh \
            "$VPS_USER@$VPS_HOST:/opt/oren/infra/signer-gate/"
          ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "bash /opt/oren/infra/signer-gate/diagnose-grant.sh '$release_sha'"
