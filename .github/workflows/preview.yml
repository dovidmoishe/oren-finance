name: PR preview
on:
  workflow_run:
    workflows: [CI]
    types: [in_progress]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to redeploy
        required: true
        type: number
permissions:
  contents: read
jobs:
  resolve:
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    environment: preview
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
      actions: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
      owner: ${{ steps.pr.outputs.owner }}
      privy_id: ${{ steps.pr.outputs.privy_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - id: pr
        uses: actions/github-script@v7
        env:
          PREVIEW_PRIVY_APP_ID: ${{ vars.PREVIEW_PRIVY_APP_ID }}
        with:
          script: |
            const {isDocsOnlyChange} = await import(process.env.GITHUB_WORKSPACE + '/infra/docs/change-scope.mjs');
            const run = context.payload.workflow_run;
            if (run && run.event !== 'pull_request') return;
            const args = {owner: context.repo.owner, repo: context.repo.repo};
            const candidates = context.eventName === 'workflow_dispatch'
              ? [{number: Number(context.payload.inputs.pr)}]
              : (await github.rest.repos.listPullRequestsAssociatedWithCommit({...args, commit_sha: run.head_sha})).data;
            for (const candidate of candidates) {
              const {data: pr} = await github.rest.pulls.get({...args, pull_number: candidate.number});
              if (pr.state !== 'open' || pr.base.ref !== 'master' || (run && pr.head.sha !== run.head_sha)) continue;
              if (pr.head.repo?.full_name !== context.payload.repository.full_name || pr.user.type !== 'User') continue;
              const status = (state, description) => github.rest.repos.createCommitStatus({...args, sha: pr.head.sha, context: 'Preview ready', state, description, target_url: `${context.serverUrl}/${args.owner}/${args.repo}/actions/runs/${context.runId}`});
              const {data: permission} = await github.rest.repos.getCollaboratorPermissionLevel({...args, username: pr.user.login});
              if (!['admin','maintain','write'].includes(permission.permission)) {
                await status('failure', 'Preview requires a repository collaborator'); continue;
              }
              const changedFiles = await github.paginate(github.rest.pulls.listFiles, {...args, pull_number: pr.number, per_page: 100});
              if (changedFiles.length === pr.changed_files && isDocsOnlyChange(changedFiles)) {
                await status('success', 'Documentation-only change; no application preview needed'); continue;
              }
              // Manual redeploys retain their early CI admission check.
              if (!run) {
                const {data: runs} = await github.rest.actions.listWorkflowRuns({...args, workflow_id: 'ci.yml', head_sha: pr.head.sha, event: 'pull_request', per_page: 20});
                if (!runs.workflow_runs.some(r => r.conclusion === 'success')) {
                  await status('failure', 'CI must pass for the current PR commit'); continue;
                }
              }
              if (!process.env.PREVIEW_PRIVY_APP_ID) { await status('failure', 'Configure PREVIEW_PRIVY_APP_ID in Preview environment'); continue; }
              core.setOutput('privy_id', process.env.PREVIEW_PRIVY_APP_ID);
              await status('pending', 'Building isolated preview');
              core.setOutput('pr', String(pr.number)); core.setOutput('sha', pr.head.sha);
              core.setOutput('owner', context.repo.owner.toLowerCase()); return;
            }
  ci-gate:
    name: Require successful CI for preview head
    needs: resolve
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        env:
          PREVIEW_SHA: ${{ needs.resolve.outputs.sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
        with:
          script: |
            const {waitForPreviewCi} = await import(process.env.GITHUB_WORKSPACE + '/infra/preview/preview-ci.mjs');
            await waitForPreviewCi({github, repo: context.repo, sha: process.env.PREVIEW_SHA, pr: Number(process.env.PR_NUMBER)});
  build-api:
    name: Build and publish preview API image
    needs: [resolve, ci-gate]
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: preview-api-image-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
      deployments: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      # Reuse decisions run trusted default-branch code, never a PR checkout.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find verified API image for unchanged source
        if: vars.API_IMAGE_REUSE_ENABLED == 'true'
        id: reuse
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.sha }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr }}
        with:
          script: |
            const {findReusableApiImage} = await import(process.env.GITHUB_WORKSPACE + '/trusted/infra/preview/api-image-reuse.mjs');
            const digest = await findReusableApiImage({github, repo: context.repo, sha: process.env.TARGET_SHA, environment: 'preview', pr: Number(process.env.PR_NUMBER)});
            if (digest) core.setOutput('digest', digest);
      - name: Reuse verified API image
        if: steps.reuse.outputs.digest != ''
        id: retag
        continue-on-error: true
        env:
          SOURCE_DIGEST: ${{ steps.reuse.outputs.digest }}
          IMAGE_TAG: pr-${{ needs.resolve.outputs.pr }}-${{ needs.resolve.outputs.sha }}
          OWNER: ${{ needs.resolve.outputs.owner }}
        run: |
          [[ "$SOURCE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ && "$IMAGE_TAG" =~ ^pr-[1-9][0-9]*-[a-f0-9]{40}$ ]]
          image="ghcr.io/$OWNER/oren-api"
          docker buildx imagetools create --tag "$image:$IMAGE_TAG" "$image@$SOURCE_DIGEST"
          docker buildx imagetools inspect "$image:$IMAGE_TAG" > /dev/null
      - id: build
        if: steps.retag.outcome != 'success'
        uses: docker/build-push-action@v6
        with:
          context: ./source/api
          push: true
          tags: ghcr.io/${{ needs.resolve.outputs.owner }}/oren-api:pr-${{ needs.resolve.outputs.pr }}-${{ needs.resolve.outputs.sha }}
          # workflow_run on the default branch gets a read-only Actions cache token.
          # Ignore export errors so a denied cache write cannot fail the preview.
          cache-from: type=gha,scope=oren-api-preview
          cache-to: type=gha,mode=max,scope=oren-api-preview,ignore-error=true
      - name: Record preview API digest
        id: digest
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAG: pr-${{ needs.resolve.outputs.pr }}-${{ needs.resolve.outputs.sha }}
          OWNER: ${{ needs.resolve.outputs.owner }}
        run: |
          image="ghcr.io/$OWNER/oren-api:$IMAGE_TAG"
          if [[ -n "$BUILT_DIGEST" ]]; then
            digest="$BUILT_DIGEST"
          else
            digest=$(docker buildx imagetools inspect "$image" | sed -n 's/^Digest: *//p' | head -n 1)
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
  build-app:
    name: Build and publish preview web image
    needs: [resolve, ci-gate]
    if: needs.resolve.outputs.pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: preview-web-image-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          build-args: |
            NEXT_PUBLIC_OREN_API_URL=/api
            NEXT_PUBLIC_PRIVY_APP_ID=${{ needs.resolve.outputs.privy_id }}
            NEXT_PUBLIC_DEPLOYMENT_ENV=preview
            NEXT_PUBLIC_PREVIEW_PR_NUMBER=${{ needs.resolve.outputs.pr }}
            NEXT_PUBLIC_COMMIT_SHA=${{ needs.resolve.outputs.sha }}
          tags: ghcr.io/${{ needs.resolve.outputs.owner }}/oren-app:pr-${{ needs.resolve.outputs.pr }}-${{ needs.resolve.outputs.sha }}
          # workflow_run on the default branch gets a read-only Actions cache token.
          # Ignore export errors so a denied cache write cannot fail the preview.
          cache-from: type=gha,scope=oren-app-preview
          cache-to: type=gha,mode=max,scope=oren-app-preview,ignore-error=true
  deploy:
    needs: [resolve, ci-gate, build-api, build-app]
    if: always() && needs.resolve.outputs.pr != ''
    runs-on: ubuntu-24.04
    environment: preview
    concurrency:
      group: preview-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: read
      statuses: write
      deployments: write
    env:
      PR: ${{ needs.resolve.outputs.pr }}
      SHA: ${{ needs.resolve.outputs.sha }}
      OWNER: ${{ needs.resolve.outputs.owner }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
    steps:
      - id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: Number(process.env.PR)});
            if (pr.state !== 'open' || pr.head.sha !== process.env.SHA) throw Error('PR closed or superseded');
            const {data} = await github.rest.repos.createDeployment({...context.repo, ref: process.env.SHA, environment: `preview-pr-${process.env.PR}`, auto_merge: false, required_contexts: [], transient_environment: true, production_environment: false});
            core.setOutput('id', data.id);
            await github.rest.repos.createDeploymentStatus({...context.repo, deployment_id: data.id, state: 'in_progress'});
      - name: Require successful CI and image builds
        env:
          CI_RESULT: ${{ needs['ci-gate'].result }}
          API_BUILD_RESULT: ${{ needs['build-api'].result }}
          APP_BUILD_RESULT: ${{ needs['build-app'].result }}
        run: test "$CI_RESULT" = success && test "$API_BUILD_RESULT" = success && test "$APP_BUILD_RESULT" = success
      # Only trusted workflow code is checked out on the deployment runner.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      - name: Configure verified SSH host
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Recheck current-head CI before activation
        uses: actions/github-script@v7
        with:
          script: |
            const {requirePreviewCi} = await import(process.env.GITHUB_WORKSPACE + '/infra/preview/preview-ci.mjs');
            await requirePreviewCi({github, repo: context.repo, sha: process.env.SHA, pr: Number(process.env.PR)});
      - name: Deploy using installed trusted controller
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.event.repository.name }}
          PRIVY_ID: ${{ needs.resolve.outputs.privy_id }}
        run: |
          [[ "$PR" =~ ^[1-9][0-9]*$ && "$SHA" =~ ^[a-f0-9]{40}$ && "$OWNER" =~ ^[a-z0-9-]+$ && "$REPO_NAME" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "$PRIVY_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          printf '%s\n' "$GH_TOKEN" | ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "bash /opt/oren/preview/control/manage.sh deploy '$PR' '$SHA' '$OWNER' '$REPO_NAME' '$PRIVY_ID'"
      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          PREVIEW_DOMAIN: ${{ vars.PREVIEW_DOMAIN || 'preview.oren.finance' }}
          API_DIGEST: ${{ needs['build-api'].outputs.digest }}
        with:
          script: |
            const args = {...context.repo};
            const {data: pr} = await github.rest.pulls.get({...args, pull_number: Number(process.env.PR)});
            const current = pr.state === 'open' && pr.head.sha === process.env.SHA;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let ownsStatus = false;
            if (current) {
              const {data: statuses} = await github.request('GET /repos/{owner}/{repo}/commits/{ref}/statuses', {...args, ref: process.env.SHA, per_page: 100});
              const latest = statuses.filter(s => s.context === 'Preview ready').sort((a, b) => b.id - a.id)[0];
              // A cancelled older image job must not overwrite its successor's status.
              ownsStatus = latest?.target_url === runUrl;
            }
            const ok = current && process.env.JOB_STATUS === 'success';
            const url = `https://pr-${process.env.PR}.${process.env.PREVIEW_DOMAIN}`;
            if (process.env.DEPLOYMENT_ID) await github.rest.repos.createDeploymentStatus({...args, deployment_id: Number(process.env.DEPLOYMENT_ID), state: !current || !ownsStatus ? 'inactive' : ok ? 'success' : 'failure', description: ok && /^sha256:[a-f0-9]{64}$/.test(process.env.API_DIGEST) ? `api ${process.env.API_DIGEST}` : undefined, environment_url: url, log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            if (current && ownsStatus) await github.rest.repos.createCommitStatus({...args, sha: process.env.SHA, context: 'Preview ready', state: ok ? 'success' : 'failure', description: ok ? 'Preview healthy; financial execution disabled' : 'Preview failed; inspect deployment logs', target_url: ok ? url : `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
