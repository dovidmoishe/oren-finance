name: Deploy admin dashboard

# Every master change to the dashboard ships once its own tests pass and the
# production release of the same commit has succeeded, so the dashboard never
# reaches production ahead of the API it calls.
on:
  push:
    branches: [master]
    paths:
      - 'admin/**'
      - 'app/components/shell/AnimatedIcons/**'
      - 'infra/admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Previously published full Git SHA to redeploy or roll back to
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Test and publish admin image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - name: Test the dashboard
        working-directory: admin
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - name: Check deployment tooling
        run: |
          bash -n infra/admin/deploy.sh
          node --test infra/admin/*.test.mjs
      - name: Set registry image name
        run: echo "ADMIN_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/oren-admin:$IMAGE_TAG" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./admin/Dockerfile
          load: true
          tags: ${{ env.ADMIN_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=oren-admin-release
          cache-to: type=gha,scope=oren-admin-release,mode=max,ignore-error=true
      - name: Verify the actual runtime image
        run: |
          docker run -d --name oren-admin-check --read-only --tmpfs /config --tmpfs /data --tmpfs /tmp \
            -p 127.0.0.1:8081:8080 -e ADMIN_API_UPSTREAM=127.0.0.1:9 "$ADMIN_IMAGE"
          base=http://127.0.0.1:8081
          curl --fail --silent --retry 10 --retry-delay 1 --retry-all-errors -o /dev/null "$base/"
          page=$(curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/headers" "$base/")
          grep -q '<div id="root"></div>' <<< "$page"
          grep -qi '^content-security-policy:' "$RUNNER_TEMP/headers"
          grep -qi '^x-robots-tag: noindex' "$RUNNER_TEMP/headers"
          asset=$(grep -oE '/assets/[A-Za-z0-9_.-]+\.js' <<< "$page" | head -n 1)
          test -n "$asset"
          # Captured first: with pipefail, grep -q closing the pipe early can fail curl.
          asset_headers=$(curl --fail --silent --show-error --head "$base$asset")
          grep -qi '^cache-control: public, max-age=31536000, immutable' <<< "$asset_headers"
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/users")" == 200 ]]
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/api/other")" == 404 ]]
      - name: Validate production Compose and Caddy configuration
        run: |
          ADMIN_RELEASE_SHA="$IMAGE_TAG" docker compose -f admin/compose.yml config --quiet
          mkdir -p "$RUNNER_TEMP/caddy-previews"
          cp infra/admin/admin.caddy "$RUNNER_TEMP/caddy-previews/production-admin.caddy"
          docker run --rm -e DOMAIN=production.example.com -e API_DOMAIN=api.production.example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$RUNNER_TEMP/caddy-previews:/etc/caddy/previews:ro" \
            caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        id: publish
        run: |
          docker push "$ADMIN_IMAGE"
          repo="${ADMIN_IMAGE%:*}"
          digest=$(docker image inspect "$ADMIN_IMAGE" --format '{{json .RepoDigests}}' | jq -er --arg prefix "$repo@" '[.[] | select(startswith($prefix)) | split("@")[1]][0]')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Collect runtime logs and remove test container
        if: always()
        run: |
          docker logs oren-admin-check 2>/dev/null || true
          docker rm -f oren-admin-check 2>/dev/null || true

  release-gate:
    name: Wait for this commit's production release
    needs: build
    if: github.event_name == 'push' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      # Trusted gating code from this workflow's commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const {requireProductionCi} = await import(process.env.GITHUB_WORKSPACE + '/infra/preview/production-ci.mjs');
            const id = await requireProductionCi({github, repo: context.repo, sha: context.sha,
              workflow: 'deploy-production.yml', label: 'production release', attempts: 280});
            core.notice('Production release verified: ' + id + ' for ' + context.sha);

  deploy:
    name: Deploy admin to production
    needs: [build, release-gate]
    if: >-
      always() && github.ref == 'refs/heads/master' &&
      ((github.event_name == 'push' && needs.build.result == 'success' &&
        needs['release-gate'].result == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.build.result == 'skipped' &&
        needs['release-gate'].result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    # Caddy is shared with the API/web and docs release workflows.
    concurrency:
      group: production-deploy
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.sha }}
      EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      GHCR_USER: ${{ github.actor }}
    steps:
      # Use this run's trusted master tooling, even when selecting an older image.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release selection and connection settings
        run: |
          [[ "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]
          [[ -z "$EXPECTED_DIGEST" || "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$GHCR_USER" =~ ^[A-Za-z0-9_-]+(\[bot\])?$ ]]
          git merge-base --is-ancestor "$IMAGE_TAG" HEAD
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      - name: Configure verified VPS host key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Stage admin release configuration
        run: |
          ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'install -d -m 750 /opt/oren/admin-release/incoming'
          scp -P "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes \
            infra/admin/deploy.sh infra/admin/admin.caddy admin/compose.yml \
            "$VPS_USER@$VPS_HOST:/opt/oren/admin-release/incoming/"
      - name: Activate and verify admin release
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "bash /opt/oren/admin-release/incoming/deploy.sh '$GHCR_OWNER' '$IMAGE_TAG' '$GHCR_USER' '$EXPECTED_DIGEST'" |
            tee "$RUNNER_TEMP/admin-deploy.log"
          index=$(sed -n 's/^ADMIN_INDEX_SHA256=\([a-f0-9]\{64\}\)$/\1/p' "$RUNNER_TEMP/admin-deploy.log")
          [[ "$index" =~ ^[a-f0-9]{64}$ ]]
          echo "ADMIN_INDEX_SHA256=$index" >> "$GITHUB_ENV"
      - name: Verify the public dashboard
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            --output "$RUNNER_TEMP/index.html" https://admin.oren.finance/
          [[ "$(sha256sum "$RUNNER_TEMP/index.html" | awk '{print $1}')" == "$ADMIN_INDEX_SHA256" ]]
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'X-Oren-Admin: 1' https://admin.oren.finance/api/admin/auth/session)
          [[ "$status" == 401 ]]
      - name: Record deployment summary
        run: |
          printf '### Oren admin dashboard\n\nURL: https://admin.oren.finance\n\nRelease: `%s`\n\nRollback: run this workflow on master with a previously published full SHA.\n' "$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
