# Admin dashboard release on the existing production network. CI deploys it with
# infra/admin/deploy.sh once the matching production release has succeeded.
# The hand-run dashboard is Compose project oren-admin, container
# oren-admin-dashboard. These names differ, so the first automated release
# starts beside it and takes over its route instead of colliding with it.
name: oren-admin-release
services:
  admin:
    image: ${ADMIN_IMAGE:?set ADMIN_IMAGE to the built admin image}
    container_name: oren-admin-web
    restart: unless-stopped
    environment:
      ADMIN_API_UPSTREAM: oren-api-1:3000
      ADMIN_RELEASE_SHA: ${ADMIN_RELEASE_SHA:?set ADMIN_RELEASE_SHA to the release commit}
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [production]
networks:
  production:
    external: true
    name: oren_oren
